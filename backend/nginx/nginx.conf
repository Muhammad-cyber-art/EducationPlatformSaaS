events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    upstream django {
        server web:8000;
        keepalive 32;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # SSL / Reverse proxy protokoli tahlili
    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # ─────────────────────────────────────────────────────────────
    # 1. HTTP Server (Port 80) — Avtomatik HTTPS ga yo'naltirish
    # ─────────────────────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name chronous.uz www.chronous.uz *.chronous.uz 189.74.99.94 localhost _;

        # Let's Encrypt renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Barcha HTTP so'rovlarni xavfsiz HTTPS ga yo'naltirish
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─────────────────────────────────────────────────────────────
    # 2. HTTPS Server (Port 443) — SSL Shifrlangan asosiy server
    # ─────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name chronous.uz www.chronous.uz *.chronous.uz 189.74.99.94 localhost _;

        # Let's Encrypt SSL sertifikatlari
        ssl_certificate /etc/letsencrypt/live/chronous.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chronous.uz/privkey.pem;

        # SSL xavfsizlik parametrlari
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        client_max_body_size 50m;
        server_tokens off;

        # Security headers
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy no-referrer-when-downgrade always;

        location /static/ {
            alias /app/static/;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000" always;
            try_files $uri $uri/ =404;
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
            try_files $uri =404;
            access_log /var/log/nginx/media_access.log;
        }

        location ~ ^/(api|adminn|refresh|swagger|redoc|schema) {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering on;
            proxy_buffers 16 16k;
            proxy_buffer_size 32k;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_redirect off;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering on;
            proxy_buffers 16 16k;
            proxy_buffer_size 32k;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
